name: Remove obsolete GitHub packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete Capsule packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for package in \
            Capsule.Build \
            Capsule.Core \
            Capsule.Maps \
            Capsule.Runtime \
            Capsule.Scenes \
            Capsule.Verify
          do
            gh api \
              --method DELETE \
              "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/nuget/${package}"
          done
