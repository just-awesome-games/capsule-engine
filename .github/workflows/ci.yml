name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Build, format, unit tests, and diagnostic coverage.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore --locked-mode

      # Both configurations have distinct analyzer sets.
      - name: Build (Debug)
        run: dotnet build --configuration Debug --no-restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Pack
        run: >
          dotnet pack Capsule.slnx
          --configuration Release
          --no-build
          --output artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error

      # Verify the sample against the packages produced above.
      - name: Restore sample (package mode)
        run: >
          dotnet restore samples/MinimalGame/MinimalGame.slnx
          --configfile samples/MinimalGame/NuGet.config
          -p:CapsuleUsePackages=true

      - name: Build sample (package mode)
        run: >
          dotnet build samples/MinimalGame/MinimalGame.slnx
          --configuration Release
          --no-restore
          -p:CapsuleUsePackages=true

      - name: Development-only exclusion (shipping)
        run: >
          dotnet build tests/Capsule.BuildProof/Capsule.BuildProof.csproj
          --configuration Release
          --no-restore
          --no-dependencies
          -p:CapsuleShipping=true

      # Verify both shipping states across an incremental rebuild.
      - name: Development-only exclusion (shipping toggle)
        run: |
          dotnet build tests/Capsule.BuildProof.Incremental/Capsule.BuildProof.Incremental.csproj --configuration Release --no-restore --no-dependencies -p:CapsuleShipping=true
          dotnet build tests/Capsule.BuildProof.Incremental/Capsule.BuildProof.Incremental.csproj --configuration Release --no-restore --no-dependencies

      - name: Format
        run: dotnet format --verify-no-changes --no-restore

      # Keep allocation and file-access gates free of coverage instrumentation.
      - name: Performance gates
        run: >
          dotnet test
          --configuration Release
          --no-build
          --filter FullyQualifiedName~Capsule.Tests.Performance
          --logger "console;verbosity=detailed"

      # Coverage is diagnostic; behavior tests are the gate.
      - name: Test with coverage
        run: >
          dotnet test
          --configuration Release
          --no-build
          --filter "FullyQualifiedName!~Capsule.Tests.Performance"
          -p:CollectCoverage=true
          '-p:Include=[Capsule.Core]*%2c[Capsule.Collision]*%2c[Capsule.Scenes]*%2c[Capsule.Runtime]*'
          '-p:ExcludeByFile=**/Capsule.Runtime/CapsuleGame.cs%2c**/Capsule.Runtime/Rendering/FrameRenderer.cs'
          -p:CoverletOutputFormat=cobertura
          -p:CoverletOutput=TestResults/coverage.cobertura.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: tests/Capsule.Tests/TestResults/coverage.cobertura.xml
          if-no-files-found: warn

  platform-and-aot:
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
            smoke-binary: ./artifacts/aot-smoke/Capsule.AotSmoke
          - os: windows-latest
            runtime: win-x64
            smoke-binary: ./artifacts/aot-smoke/Capsule.AotSmoke.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          name: packages
          path: artifacts/packages

      # Windows tests cover platform-specific path rules not exercised on Linux.
      - name: Restore engine
        if: matrix.os == 'windows-latest'
        run: dotnet restore --locked-mode

      - name: Build engine (Release)
        if: matrix.os == 'windows-latest'
        run: dotnet build --configuration Release --no-restore

      - name: Test
        if: matrix.os == 'windows-latest'
        run: dotnet test --configuration Release --no-build

      # The shell publish verifies the complete game graph is ILC-analyzable.
      - name: Restore sample from local packages
        run: >
          dotnet restore samples/MinimalGame/MinimalGame.slnx
          --configfile samples/MinimalGame/NuGet.config
          --runtime ${{ matrix.runtime }}
          -p:CapsuleUsePackages=true

      - name: Publish sample shell from local packages with NativeAOT
        run: >
          dotnet publish samples/MinimalGame/src/MinimalGame.Shell/MinimalGame.Shell.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --no-restore
          -p:CapsuleUsePackages=true
          -p:PublishAot=true

      # Run the independent device-free smoke fixture on both platforms.
      - name: Publish the AOT smoke
        run: >
          dotnet publish tests/Capsule.AotSmoke/Capsule.AotSmoke.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          -p:PublishAot=true
          --output artifacts/aot-smoke

      - name: Run the published smoke binary
        run: ${{ matrix.smoke-binary }}
