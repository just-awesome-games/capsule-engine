name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Build, format, unit and coverage. The engine is a library: window-and-device
  # testing remains a separate Runtime integration concern.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore --locked-mode

      # Both configurations: Release is what games consume, Debug is what the
      # engine is developed and debugged against, and their analyzer sets differ.
      - name: Build (Debug)
        run: dotnet build --configuration Debug --no-restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Pack
        run: >
          dotnet pack Capsule.slnx
          --configuration Release
          --no-build
          --output artifacts/packages

      # Source mode is covered by the root builds above, which the sample is a solution member of.
      # This lane is the packaged one: the same sample resolved from the packages just produced.
      - name: Restore sample (package mode)
        run: >
          dotnet restore samples/MinimalGame/MinimalGame.slnx
          --configfile samples/MinimalGame/NuGet.config
          -p:CapsuleUsePackages=true

      - name: Build sample (package mode)
        run: >
          dotnet build samples/MinimalGame/MinimalGame.slnx
          --configuration Release
          --no-restore
          -p:CapsuleUsePackages=true

      - name: Format
        run: dotnet format --verify-no-changes --no-restore

      # The workload-scale gates, run uninstrumented and named on their own so a regression
      # reads as one. They assert allocation and file access, not wall time: those two are
      # deterministic where a duration on a shared runner is not. The coverage passes below
      # exclude them, so this is the only run and its numbers are the engine's own; detailed
      # verbosity is what puts them in the log.
      - name: Performance gates
        run: >
          dotnet test
          --configuration Release
          --no-build
          --filter FullyQualifiedName~Capsule.Tests.Performance
          --logger "console;verbosity=detailed"

      # Per-assembly coverage gates so no module hides behind another.
      # Each included module must clear its floor independently. The performance gates ran
      # uninstrumented above and are excluded here: under coverage instrumentation their
      # wall-clock numbers are the instrumentation's, not the engine's.
      - name: Test with coverage (Core, Collision, Scenes)
        run: >
          dotnet test
          --configuration Release
          --no-build
          --filter "FullyQualifiedName!~Capsule.Tests.Performance"
          -p:CollectCoverage=true
          '-p:Include=[Capsule.Core]*%2c[Capsule.Collision]*%2c[Capsule.Scenes]*'
          -p:CoverletOutputFormat=cobertura
          -p:CoverletOutput=TestResults/coverage.pure.cobertura.xml
          -p:Threshold=85
          -p:ThresholdType=line
          -p:ThresholdStat=minimum

      - name: Test with coverage (Runtime)
        run: >
          dotnet test
          --configuration Release
          --no-build
          --filter "FullyQualifiedName!~Capsule.Tests.Performance"
          -p:CollectCoverage=true
          '-p:Include=[Capsule.Runtime]*'
          '-p:ExcludeByFile=**/Capsule.Runtime/CapsuleGame.cs%2c**/Capsule.Runtime/Rendering/FrameRenderer.cs'
          -p:CoverletOutputFormat=cobertura
          -p:CoverletOutput=TestResults/coverage.runtime.cobertura.xml
          -p:Threshold=50
          -p:ThresholdType=line
          -p:ThresholdStat=minimum

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: tests/Capsule.Tests/TestResults/coverage.*.cobertura.xml
          if-no-files-found: warn

  platform-and-aot:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
            smoke-binary: ./artifacts/aot-smoke/Capsule.AotSmoke
          - os: windows-latest
            runtime: win-x64
            smoke-binary: ./artifacts/aot-smoke/Capsule.AotSmoke.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Windows only. The Linux leg's restore, build and tests are already build-and-test's on the
      # same runner image, and each publish below restores and compiles for its own runtime. The
      # Windows leg keeps them because the specs are platform-agnostic while what some of them
      # assert is not: the crash log's reserved device names and its application-data path are
      # Windows rules the Linux job never executes.
      - name: Restore engine
        if: matrix.os == 'windows-latest'
        run: dotnet restore --locked-mode

      - name: Build engine (Release)
        if: matrix.os == 'windows-latest'
        run: dotnet build --configuration Release --no-restore

      - name: Test
        if: matrix.os == 'windows-latest'
        run: dotnet test --configuration Release --no-build

      # The shell links the graphics backend, so publishing it is the compile-level check that
      # a whole game — window and all — stays ILC-analyzable.
      - name: Publish sample shell with NativeAOT
        run: >
          dotnet publish samples/MinimalGame/src/MinimalGame.Shell/MinimalGame.Shell.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          -p:PublishAot=true

      # Publishing proves the graph is analyzable. Only running the result proves the game
      # boots, and boot is where ahead-of-time compilation actually fails: the smoke binary
      # drives the sample's logic without a device, so its published binary runs headless on
      # both platforms.
      - name: Publish the AOT smoke
        run: >
          dotnet publish tests/Capsule.AotSmoke/Capsule.AotSmoke.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          -p:PublishAot=true
          --output artifacts/aot-smoke

      - name: Run the published smoke binary
        run: ${{ matrix.smoke-binary }}
