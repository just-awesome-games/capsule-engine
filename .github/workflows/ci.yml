name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Build, format, unit and coverage. The engine is a library: it is never launched
  # here, and the window-and-device paths are covered by a consuming game's verify run.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore --locked-mode

      # Both configurations: Release is what games consume, Debug is what the
      # engine is developed and debugged against, and their analyzer sets differ.
      - name: Build (Debug)
        run: dotnet build --configuration Debug --no-restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Format
        run: dotnet format --verify-no-changes --no-restore

      # Include filters are joined with the MSBuild comma escape, not a literal comma.
      # Capsule.Levels.Cli and Capsule.Scenes.Generator are dev-time tools and are not
      # gated; the importer is covered through the golden fixtures and the generator
      # through its own specs either way.
      - name: Test with coverage
        run: >
          dotnet test
          --configuration Release
          --no-build
          -p:CollectCoverage=true
          '-p:Include=[Capsule.Core]*%2c[Capsule.Levels]*%2c[Capsule.Scenes]*'
          -p:CoverletOutputFormat=cobertura
          -p:CoverletOutput=TestResults/coverage.cobertura.xml
          -p:Threshold=80
          -p:ThresholdType=line
          -p:ThresholdStat=total

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: Capsule.Tests/TestResults/coverage.cobertura.xml
          if-no-files-found: warn
