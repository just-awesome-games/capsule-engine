name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Format
        run: dotnet format --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      # The smoke run the AOT legs publish, in the other build direction: a marker that excluded in
      # an ordinary build fails here.
      - name: Development-only inclusion (ordinary build)
        run: >
          dotnet run --project tests/Capsule.AotSmoke
          --configuration Release
          --no-build
          --no-restore
          -- --saves ${{ runner.temp }}/capsule-smoke-ordinary

      - name: Pack
        run: >
          dotnet pack Capsule.slnx
          --configuration Release
          --no-build
          --output artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error

      # Verify the sample against the packages produced above.
      - name: Restore sample (package mode)
        run: >
          dotnet restore samples/MinimalGame/MinimalGame.slnx
          --configfile samples/MinimalGame/NuGet.config
          -p:CapsuleUsePackages=true

      - name: Build sample (package mode)
        run: >
          dotnet build samples/MinimalGame/MinimalGame.slnx
          --configuration Release
          --no-restore
          -p:CapsuleUsePackages=true

  aot:
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
            smoke-binary: ./artifacts/aot-smoke/Capsule.AotSmoke
          - os: windows-latest
            runtime: win-x64
            smoke-binary: ./artifacts/aot-smoke/Capsule.AotSmoke.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          name: packages
          path: artifacts/packages

      - name: Restore sample from local packages
        run: >
          dotnet restore samples/MinimalGame/MinimalGame.slnx
          --configfile samples/MinimalGame/NuGet.config
          --runtime ${{ matrix.runtime }}
          -p:CapsuleUsePackages=true
          -p:PublishAot=true

      # The shell publish verifies the complete game graph is ILC-analyzable.
      - name: Publish sample shell from local packages with NativeAOT
        run: >
          dotnet publish samples/MinimalGame/src/MinimalGame.Shell/MinimalGame.Shell.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --no-restore
          -p:CapsuleUsePackages=true
          -p:PublishAot=true

      - name: Publish the AOT smoke
        run: >
          dotnet publish tests/Capsule.AotSmoke/Capsule.AotSmoke.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          -p:PublishAot=true
          --output artifacts/aot-smoke

      - name: Run the published smoke binary
        run: ${{ matrix.smoke-binary }} --saves ${{ runner.temp }}/capsule-smoke-saves
