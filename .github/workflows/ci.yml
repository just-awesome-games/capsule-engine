name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Build, format, unit and coverage. The engine is a library: window-and-device
  # testing remains a separate Runtime integration concern.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore --locked-mode

      # Both configurations: Release is what games consume, Debug is what the
      # engine is developed and debugged against, and their analyzer sets differ.
      - name: Build (Debug)
        run: dotnet build --configuration Debug --no-restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Pack
        run: >
          dotnet pack Capsule.sln
          --configuration Release
          --no-build
          --output artifacts/packages

      - name: Restore package consumer
        run: >
          dotnet restore tests/PackageConsumer/PackageConsumer.slnx
          --configfile tests/PackageConsumer/PackageConsumer.NuGet.config

      - name: Build package consumer
        run: >
          dotnet build tests/PackageConsumer/PackageConsumer.slnx
          --configuration Release
          --no-restore

      - name: Restore forced-package consumer
        run: >
          dotnet restore tests/PackageConsumer/PackageConsumer.slnx
          --configfile tests/PackageConsumer/PackageConsumer.NuGet.config
          -p:CapsuleSourcePath=../..
          -p:CapsuleUsePackages=true

      - name: Build forced-package consumer
        run: >
          dotnet build tests/PackageConsumer/PackageConsumer.slnx
          --configuration Release
          --no-restore
          -p:CapsuleSourcePath=../..
          -p:CapsuleUsePackages=true

      - name: Restore source consumer
        run: >
          dotnet restore tests/PackageConsumer/PackageConsumer.slnx
          --configfile tests/PackageConsumer/PackageConsumer.NuGet.config
          -p:CapsuleSourcePath=../..

      - name: Build source consumer
        run: >
          dotnet build tests/PackageConsumer/PackageConsumer.slnx
          --configuration Release
          --no-restore
          -p:CapsuleSourcePath=../..

      - name: Format
        run: dotnet format --verify-no-changes --no-restore

      # The workload-scale gates, run uninstrumented and named on their own so a regression
      # reads as one. They assert allocation and file access, not wall time: those two are
      # deterministic where a duration on a shared runner is not. They run again inside the
      # coverage pass below; this is the run whose numbers are the engine's own, and detailed
      # verbosity is what puts them in the log.
      - name: Performance gates
        run: >
          dotnet test
          --configuration Release
          --no-build
          --filter FullyQualifiedName~Capsule.Tests.Performance
          --logger "console;verbosity=detailed"

      # Include and exclude filters are joined with the MSBuild comma escape, not a literal
      # comma. Capsule.Maps.Cli and Capsule.Scenes.Generator are dev-time tools and are not
      # gated; the importer is covered through the golden fixtures and the generator
      # through its own specs either way.
      #
      # Capsule.Runtime is gated on everything a test can reach — the builders, the letterbox
      # fit, the scheduler, the scene host, deadzone filtering. The two types that need a live
      # window and device are excluded by file rather than the assembly by name, so a new
      # device-free type in Runtime is gated the day it lands.
      - name: Test with coverage
        run: >
          dotnet test
          --configuration Release
          --no-build
          -p:CollectCoverage=true
          '-p:Include=[Capsule.Core]*%2c[Capsule.Maps]*%2c[Capsule.Runtime]*%2c[Capsule.Scenes]*'
          '-p:ExcludeByFile=**/Capsule.Runtime/CapsuleGame.cs%2c**/Capsule.Runtime/Rendering/FrameRenderer.cs'
          -p:CoverletOutputFormat=cobertura
          -p:CoverletOutput=TestResults/coverage.cobertura.xml
          -p:Threshold=80
          -p:ThresholdType=line
          -p:ThresholdStat=total

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: Capsule.Tests/TestResults/coverage.cobertura.xml
          if-no-files-found: warn

  platform-and-aot:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
            smoke-binary: ./artifacts/aot-smoke/PackageConsumer.Smoke
          - os: windows-latest
            runtime: win-x64
            smoke-binary: ./artifacts/aot-smoke/PackageConsumer.Smoke.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore engine
        run: dotnet restore --locked-mode

      - name: Build engine (Release)
        run: dotnet build --configuration Release --no-restore

      # The specs are platform-agnostic; what they assert is not. The crash log's reserved
      # device names and its application-data path are Windows rules, and the Linux leg above
      # never executes them.
      - name: Test
        if: matrix.os == 'windows-latest'
        run: dotnet test --configuration Release --no-build

      # The shell links the graphics backend, so publishing it is the compile-level check that
      # a whole game — window and all — stays ILC-analyzable.
      - name: Publish source consumer with NativeAOT
        run: >
          dotnet publish tests/PackageConsumer/Shell/PackageConsumer.Shell.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          -p:PublishAot=true
          -p:CapsuleSourcePath=../..

      # Publishing proves the graph is analyzable. Only running the result proves the game
      # boots, and boot is where ahead-of-time compilation actually fails: the smoke consumer
      # is device-free, so its published binary runs headless on both platforms.
      - name: Publish smoke consumer with NativeAOT
        run: >
          dotnet publish tests/PackageConsumer/Smoke/PackageConsumer.Smoke.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          -p:PublishAot=true
          -p:CapsuleSourcePath=../..
          --output artifacts/aot-smoke

      - name: Run the published smoke consumer
        run: ${{ matrix.smoke-binary }}
