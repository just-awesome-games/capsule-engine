name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Build, format, unit and coverage. The engine is a library: window-and-device
  # testing remains a separate Runtime integration concern.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore --locked-mode

      # Both configurations: Release is what games consume, Debug is what the
      # engine is developed and debugged against, and their analyzer sets differ.
      - name: Build (Debug)
        run: dotnet build --configuration Debug --no-restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Pack
        run: >
          dotnet pack Capsule.slnx
          --configuration Release
          --no-build
          --output artifacts/packages

      - name: Restore sample (package mode)
        run: >
          dotnet restore samples/MinimalGame/MinimalGame.slnx
          --configfile samples/MinimalGame/NuGet.config

      - name: Build sample (package mode)
        run: >
          dotnet build samples/MinimalGame/MinimalGame.slnx
          --configuration Release
          --no-restore

      - name: Restore sample (source mode)
        run: >
          dotnet restore samples/MinimalGame/MinimalGame.slnx
          --configfile samples/MinimalGame/NuGet.config
          -p:CapsuleSourcePath=../..

      - name: Build sample (source mode)
        run: >
          dotnet build samples/MinimalGame/MinimalGame.slnx
          --configuration Release
          --no-restore
          -p:CapsuleSourcePath=../..

      - name: Format
        run: dotnet format --verify-no-changes --no-restore

      # The workload-scale gates, run uninstrumented and named on their own so a regression
      # reads as one. They assert allocation and file access, not wall time: those two are
      # deterministic where a duration on a shared runner is not. They run again inside the
      # coverage pass below; this is the run whose numbers are the engine's own, and detailed
      # verbosity is what puts them in the log.
      - name: Performance gates
        run: >
          dotnet test
          --configuration Release
          --no-build
          --filter FullyQualifiedName~Capsule.Tests.Performance
          --logger "console;verbosity=detailed"

      # Per-assembly coverage gates so no module hides behind another.
      # Each included module must clear its floor independently.
      - name: Test with coverage (Core, Collision, Scenes)
        run: >
          dotnet test
          --configuration Release
          --no-build
          -p:CollectCoverage=true
          '-p:Include=[Capsule.Core]*%2c[Capsule.Collision]*%2c[Capsule.Scenes]*'
          -p:CoverletOutputFormat=cobertura
          -p:CoverletOutput=TestResults/coverage.pure.cobertura.xml
          -p:Threshold=85
          -p:ThresholdType=line
          -p:ThresholdStat=minimum

      - name: Test with coverage (Runtime)
        run: >
          dotnet test
          --configuration Release
          --no-build
          -p:CollectCoverage=true
          '-p:Include=[Capsule.Runtime]*'
          '-p:ExcludeByFile=**/Capsule.Runtime/CapsuleGame.cs%2c**/Capsule.Runtime/Rendering/FrameRenderer.cs'
          -p:CoverletOutputFormat=cobertura
          -p:CoverletOutput=TestResults/coverage.runtime.cobertura.xml
          -p:Threshold=50
          -p:ThresholdType=line
          -p:ThresholdStat=minimum

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: tests/Capsule.Tests/TestResults/coverage.*.cobertura.xml
          if-no-files-found: warn

  platform-and-aot:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
            smoke-binary: ./artifacts/aot-smoke/MinimalGame.Smoke
          - os: windows-latest
            runtime: win-x64
            smoke-binary: ./artifacts/aot-smoke/MinimalGame.Smoke.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore engine
        run: dotnet restore --locked-mode

      - name: Build engine (Release)
        run: dotnet build --configuration Release --no-restore

      # The specs are platform-agnostic; what they assert is not. The crash log's reserved
      # device names and its application-data path are Windows rules, and the Linux leg above
      # never executes them.
      - name: Test
        if: matrix.os == 'windows-latest'
        run: dotnet test --configuration Release --no-build

      # The shell links the graphics backend, so publishing it is the compile-level check that
      # a whole game — window and all — stays ILC-analyzable.
      - name: Publish sample shell with NativeAOT
        run: >
          dotnet publish samples/MinimalGame/src/MinimalGame.Shell/MinimalGame.Shell.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          -p:PublishAot=true
          -p:CapsuleSourcePath=../..

      # Publishing proves the graph is analyzable. Only running the result proves the game
      # boots, and boot is where ahead-of-time compilation actually fails: the smoke binary
      # is device-free, so its published binary runs headless on both platforms.
      - name: Publish sample smoke with NativeAOT
        run: >
          dotnet publish samples/MinimalGame/src/MinimalGame.Smoke/MinimalGame.Smoke.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          -p:PublishAot=true
          -p:CapsuleSourcePath=../..
          --output artifacts/aot-smoke

      - name: Run the published smoke binary
        run: ${{ matrix.smoke-binary }}
