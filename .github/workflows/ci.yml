name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Format takes no MSBuild properties, and its workspace must match the Release build above.
      - name: Format
        env:
          Configuration: Release
        run: dotnet format --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      # The smoke run the AOT legs publish, in the other build direction: a marker that excluded in
      # an ordinary build fails here.
      - name: Development-only inclusion (ordinary build)
        run: >
          dotnet run --project tests/Capsule.AotSmoke
          --configuration Release
          --no-build
          --no-restore

      - name: Pack
        run: >
          dotnet pack Capsule.slnx
          --configuration Release
          --no-build
          --output artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error

      # Verify the sample against the packages produced above, in an empty cache. The source-mode
      # restore above has already filled the cache the sample's NuGet.config names.
      - name: Restore sample (package mode)
        run: >
          dotnet restore samples/MinimalGame/MinimalGame.slnx
          --configfile samples/MinimalGame/NuGet.config
          -p:CapsuleSourcePath=
          -p:RestorePackagesPath=${{ runner.temp }}/package-consumer-cache

      - name: Build sample (package mode)
        run: >
          dotnet build samples/MinimalGame/MinimalGame.slnx
          --configuration Release
          --no-restore
          -p:CapsuleSourcePath=

  aot:
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
            smoke-binary: ./artifacts/aot-smoke/Capsule.AotSmoke
            game-binary: ./MinimalGame
          - os: windows-latest
            runtime: win-x64
            smoke-binary: ./artifacts/aot-smoke/Capsule.AotSmoke.exe
            game-binary: ./MinimalGame.exe
          - os: macos-latest
            runtime: osx-arm64
            smoke-binary: ./artifacts/aot-smoke/Capsule.AotSmoke
            game-binary: ./MinimalGame
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          name: packages
          path: artifacts/packages

      - name: Restore sample from local packages
        run: >
          dotnet restore samples/MinimalGame/MinimalGame.slnx
          --configfile samples/MinimalGame/NuGet.config
          --runtime ${{ matrix.runtime }}
          -p:CapsuleSourcePath=
          -p:PublishAot=true

      # A fresh checkout holds no record of an earlier publish. The publish removes this asset anyway.
      - name: Plant an asset no build ships in the sample's publish
        shell: bash
        run: |
          stale=samples/MinimalGame/src/MinimalGame.Shell/bin/Release/net10.0/${{ matrix.runtime }}/publish/assets/stale/stale.png
          mkdir -p "$(dirname "$stale")"
          touch "$stale"

      # The shell publish verifies the complete game graph is ILC-analyzable.
      - name: Publish sample shell from local packages with NativeAOT
        run: >
          dotnet publish samples/MinimalGame/src/MinimalGame.Shell/MinimalGame.Shell.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --no-restore
          -p:CapsuleSourcePath=
          -p:PublishAot=true

      - name: The sample's publish carries its licenses
        shell: bash
        run: |
          licenses=samples/MinimalGame/src/MinimalGame.Shell/bin/Release/net10.0/${{ matrix.runtime }}/publish/licenses
          for file in LICENSE-Capsule.txt THIRD-PARTY-NOTICES-Capsule.md LICENSE-dotnet.txt THIRD-PARTY-NOTICES-dotnet.txt; do
            test -s "$licenses/$file" || { echo "missing $licenses/$file"; exit 1; }
          done

      - name: The sample's publish holds only the assets its build ships
        shell: bash
        run: |
          assets=samples/MinimalGame/src/MinimalGame.Shell/bin/Release/net10.0/${{ matrix.runtime }}/publish/assets
          test ! -e "$assets/stale" || { echo "an earlier publish's asset survived in $assets/stale"; exit 1; }
          test -d "$assets" || { echo "missing $assets"; exit 1; }

      # The sample again with development flags kept, whose command line takes the driver that plays it.
      - name: Publish the sample to play
        run: >
          dotnet publish samples/MinimalGame/src/MinimalGame.Shell/MinimalGame.Shell.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --no-restore
          -p:CapsuleSourcePath=
          -p:PublishAot=true
          -p:CapsuleShipping=false
          --output artifacts/sample-play

      # The runners have no GPU. Linux draws through Mesa's software OpenGL on a virtual display, and
      # macOS through its own software renderer. Windows ships OpenGL 1.1 alone, and Mesa's software
      # OpenGL, placed beside the executable, takes its place for this run.
      - name: Install a virtual display and software OpenGL
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y xvfb libgl1-mesa-dri

      - name: Place software OpenGL beside the sample
        if: runner.os == 'Windows'
        shell: bash
        env:
          MESA: 26.2.4
          MESA_SHA256: 351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695
        run: |
          curl -sSfL -o "$RUNNER_TEMP/mesa.7z" "https://github.com/pal1000/mesa-dist-win/releases/download/$MESA/mesa3d-$MESA-release-msvc.7z"
          echo "$MESA_SHA256  $RUNNER_TEMP/mesa.7z" | sha256sum --check
          7z e "$RUNNER_TEMP/mesa.7z" -oartifacts/sample-play x64/opengl32.dll x64/libgallium_wgl.dll

      # SDL3 and the bridge load from beside the executable and open the window and the GL context, and
      # the Walkthrough driver plays the room to the game's own exit.
      - name: Play the sample
        shell: bash
        timeout-minutes: 5
        working-directory: artifacts/sample-play
        run: |
          play=(${{ matrix.game-binary }} --scene scenes/room --driver Walkthrough)
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" "${play[@]}"
          else
            "${play[@]}"
          fi

      - name: Publish the AOT smoke
        run: >
          dotnet publish tests/Capsule.AotSmoke/Capsule.AotSmoke.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          -p:PublishAot=true
          --output artifacts/aot-smoke

      - name: Run the published smoke binary
        run: ${{ matrix.smoke-binary }}
