name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Build, format, unit and coverage. The engine is a library: window-and-device
  # verification remains a separate Runtime integration concern.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore --locked-mode

      # Both configurations: Release is what games consume, Debug is what the
      # engine is developed and debugged against, and their analyzer sets differ.
      - name: Build (Debug)
        run: dotnet build --configuration Debug --no-restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Pack
        run: >
          dotnet pack Capsule.sln
          --configuration Release
          --no-build
          --output artifacts/packages

      - name: Restore package consumer
        run: >
          dotnet restore tests/PackageConsumer/PackageConsumer.slnx
          --configfile tests/PackageConsumer/PackageConsumer.NuGet.config

      - name: Build package consumer
        run: >
          dotnet build tests/PackageConsumer/PackageConsumer.slnx
          --configuration Release
          --no-restore

      - name: Restore forced-package consumer
        run: >
          dotnet restore tests/PackageConsumer/PackageConsumer.slnx
          --configfile tests/PackageConsumer/PackageConsumer.NuGet.config
          -p:CapsuleSourcePath=../..
          -p:CapsuleUsePackages=true

      - name: Build forced-package consumer
        run: >
          dotnet build tests/PackageConsumer/PackageConsumer.slnx
          --configuration Release
          --no-restore
          -p:CapsuleSourcePath=../..
          -p:CapsuleUsePackages=true

      - name: Restore source consumer
        run: >
          dotnet restore tests/PackageConsumer/PackageConsumer.slnx
          --configfile tests/PackageConsumer/PackageConsumer.NuGet.config
          -p:CapsuleSourcePath=../..

      - name: Build source consumer
        run: >
          dotnet build tests/PackageConsumer/PackageConsumer.slnx
          --configuration Release
          --no-restore
          -p:CapsuleSourcePath=../..

      - name: Format
        run: dotnet format --verify-no-changes --no-restore

      # Include filters are joined with the MSBuild comma escape, not a literal comma.
      # Capsule.Maps.Cli and Capsule.Scenes.Generator are dev-time tools and are not
      # gated; the importer is covered through the golden fixtures and the generator
      # through its own specs either way.
      - name: Test with coverage
        run: >
          dotnet test
          --configuration Release
          --no-build
          -p:CollectCoverage=true
          '-p:Include=[Capsule.Core]*%2c[Capsule.Maps]*%2c[Capsule.Scenes]*%2c[Capsule.Verify]*'
          -p:CoverletOutputFormat=cobertura
          -p:CoverletOutput=TestResults/coverage.cobertura.xml
          -p:Threshold=80
          -p:ThresholdType=line
          -p:ThresholdStat=total

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: Capsule.Tests/TestResults/coverage.cobertura.xml
          if-no-files-found: warn

  platform-and-aot:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore engine
        run: dotnet restore --locked-mode

      - name: Build engine (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Publish source consumer with NativeAOT
        run: >
          dotnet publish tests/PackageConsumer/Shell/PackageConsumer.Shell.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          -p:PublishAot=true
          -p:CapsuleSourcePath=../..
