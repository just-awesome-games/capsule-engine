name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Format takes no MSBuild properties, and its workspace must match the Release build above.
      - name: Format
        env:
          Configuration: Release
        run: dotnet format --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      # The smoke the Linux AOT leg publishes, run in the other build direction: a marker that
      # excluded in an ordinary build fails here.
      - name: Development-only inclusion (ordinary build)
        run: >
          dotnet run --project tests/Capsule.AotSmoke
          --configuration Release
          --no-build
          --no-restore

      - name: Pack
        run: >
          dotnet pack Capsule.slnx
          --configuration Release
          --no-build
          --output artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error

  aot:
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
          - os: macos-latest
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          name: packages
          path: artifacts/packages

      - name: Restore sample from local packages
        run: >
          dotnet restore samples/MinimalGame/MinimalGame.slnx
          --configfile samples/MinimalGame/NuGet.config
          --runtime ${{ matrix.runtime }}
          -p:CapsuleSourcePath=
          -p:PublishAot=true

      # The shell publish verifies the complete game graph is ILC-analyzable.
      - name: Publish sample shell from local packages with NativeAOT
        run: >
          dotnet publish samples/MinimalGame/src/MinimalGame.Shell/MinimalGame.Shell.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --no-restore
          -p:CapsuleSourcePath=
          -p:PublishAot=true

      - name: The sample's publish carries its licenses
        shell: bash
        run: |
          licenses=samples/MinimalGame/src/MinimalGame.Shell/bin/Release/net10.0/${{ matrix.runtime }}/publish/licenses
          for file in LICENSE-Capsule.txt THIRD-PARTY-NOTICES-Capsule.md LICENSE-dotnet.txt THIRD-PARTY-NOTICES-dotnet.txt; do
            test -s "$licenses/$file" || { echo "missing $licenses/$file"; exit 1; }
          done

      # The sample again with development flags kept, whose command line takes the driver that plays it.
      # The runners have no GPU. Linux draws through Mesa's software Vulkan driver, lavapipe, on a
      # virtual display. Direct3D 12 has no software adapter and the macOS runners expose no Metal
      # device, so only the Linux leg plays.
      - name: Publish the sample to play
        if: runner.os == 'Linux'
        run: >
          dotnet publish samples/MinimalGame/src/MinimalGame.Shell/MinimalGame.Shell.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          --no-restore
          -p:CapsuleSourcePath=
          -p:PublishAot=true
          -p:CapsuleShipping=false
          --output artifacts/sample-play

      - name: Install a virtual display and software Vulkan
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y xvfb mesa-vulkan-drivers

      # SDL3 loads from beside the executable and opens the window and the GPU device, and the
      # Walkthrough driver plays the room, then the hall, which draws with a game shader, each to the
      # game's own exit.
      - name: Play the sample
        if: runner.os == 'Linux'
        timeout-minutes: 5
        working-directory: artifacts/sample-play
        run: |
          play() {
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" ./MinimalGame "$@"
          }
          play --scene scenes/room --driver Walkthrough
          play --scene scenes/halls/hall --payload WestArrival --driver Walkthrough

      # The shipping axis is decided before native code generation and is the same on every
      # operating system. One leg holds it.
      - name: Publish the AOT smoke
        if: runner.os == 'Linux'
        run: >
          dotnet publish tests/Capsule.AotSmoke/Capsule.AotSmoke.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          -p:PublishAot=true
          --output artifacts/aot-smoke

      - name: Run the published smoke binary
        if: runner.os == 'Linux'
        run: ./artifacts/aot-smoke/Capsule.AotSmoke
